<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>pw-dev screenshot monitor</title>
    <link rel="stylesheet" href="/monitor.css">
  </head>
  <body>
    <header class="monitor-topbar">
      <div class="monitor-brand">
        <div class="eyebrow">PW-DEV LIVE SESSION</div>
        <h1 id="monitor-title">Screenshot monitor</h1>
        <div id="monitor-subtitle" class="muted">Connecting…</div>
      </div>
      <nav class="monitor-nav" aria-label="Monitor navigation">
        <div class="target-nav">
          <span class="eyebrow">TARGET</span>
          <a id="nav-target-url" href="#" target="_blank" rel="noopener noreferrer">Waiting for target…</a>
        </div>
        <span id="monitor-status" class="status-pill neutral">Connecting</span>
        <a href="/" target="_blank" rel="noopener noreferrer">Dashboard</a>
        <button id="refresh-screenshot" type="button">Refresh screenshot</button>
      </nav>
    </header>

    <main class="monitor-layout">
      <section class="mirror-panel panel">
        <div class="panel-head mirror-head">
          <div id="page-meta" class="muted">Waiting for page state…</div>
        </div>
        <div id="mirror-frame-wrap" class="mirror-frame-wrap">
          <img id="mirror-image" alt="Live browser screenshot">
          <div id="mirror-click-marker" class="mirror-click-marker" aria-hidden="true"></div>
          <div id="mirror-empty" class="mirror-empty">Waiting for a live browser screenshot…</div>
        </div>
        <div class="mirror-footer">
          <span id="viewport-meta">Viewport —</span>
          <span id="scroll-meta">Scroll —</span>
          <span id="click-meta">Click —</span>
          <span id="update-meta">Updated —</span>
        </div>
      </section>

    </main>

    <script src="/monitor.js" type="module"></script>
  </body>
</html>
