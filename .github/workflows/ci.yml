name: Knowledge base

on:
  pull_request:
  push:
    branches: [main]

jobs:
  knowledge-base:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check:kb
      - run: npm run test:server
